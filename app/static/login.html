<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login · The Outliers AAC</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">
  <main class="login-container">
    <header>
      <p class="eyebrow">B — THE OUTLIERS</p>
      <h1>Welcome back</h1>
      <p class="intro">Sign in to access your communication space.</p>
    </header>

    <form id="login-form" class="login-form">
      <label for="email">Email address</label>
      <input id="email" type="email" autocomplete="username" required placeholder="name@example.com">

      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required placeholder="••••••••">

      <p id="login-status" role="status" aria-live="polite"></p>

      <button type="submit" id="login-btn">Sign In</button>
    </form>

    <footer class="login-footer">
      <p>For an account or password reset, contact the project team.</p>
    </footer>
  </main>
  <script src="/static/login.js" defer></script>
</body>
</html>
